services:
  - type: web
    name: signalx-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: LLM_PROVIDER
        value: deepseek
      - key: SUPABASE_STORAGE_BUCKET
        value: evidence-dossiers
      - key: REDIS_URL
        value: "" # Zero cost in memory velocity tracking
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
