<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="signalx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#090d16" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="32" height="32" rx="7" fill="url(#signalx-bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Shield and Checkmark -->
  <g filter="url(#icon-shadow)">
    <!-- Shield Outline -->
    <path
      d="M16 6 L24 9.5 V15.2 C24 20.3 20.6 24.2 16 26 C11.4 24.2 8 20.3 8 15.2 V9.5 L16 6 Z"
      fill="none"
      stroke="url(#shield-stroke)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center Checkmark -->
    <path
      d="M12.5 15.5 L15 18 L20 12.5"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
